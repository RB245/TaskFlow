[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally absent: env.py reads DATABASE_URL from the
# application settings so migrations can never point somewhere different from
# the app.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# No post_write_hooks: formatting generated revisions is handled by the same
# `ruff format` run as the rest of the tree, so there is one formatter and one
# place it is configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
